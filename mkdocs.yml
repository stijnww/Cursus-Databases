site_name: Cursus Databases
theme:
  name: material
  features:
    - navigation.tabs                 # bovenaan horizontale tabs i.p.v. enkel zijbalk
    - navigation.tabs.sticky          # tabs blijven zichtbaar bij scrollen
    - search.suggest                  # zoeksuggesties tijdens typen
    - search.highlight                # zoekterm markeren in resultaten
nav:
  - Home: index.md
  - Inleiding: inleiding.md
  - Relationele modellen: relationele_modellen.md
  - ER-diagrammen: er_diagrammen.md
  - SQL basis: sql_basis.md
  - Joins: joins.md
  - Normalisatie: normalisatie.md
  - Indexen en performantie: indexen_performantie.md
  - Transacties: transacties.md
  - Praktijkcases: praktijkcases.md
plugins:
  - search                            # zoekfunctie (deze staat standaard al aan, maar mag hier expliciet)
  - print-site:
      add_to_navigation: true         # voegt een "Afdrukken"-link toe aan de navigatie, zoals bij je collega
      print_page_title: "Afdrukken"