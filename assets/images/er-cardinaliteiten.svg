<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="title desc">
  <title id="title">Drie voorbeelden van cardinaliteit</title>
  <desc id="desc">Van links naar rechts: een student heeft één studentnummer, een docent geeft les aan meerdere studenten en meerdere studenten volgen meerdere cursussen.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #18323b; }
    .entity { fill: #fff; stroke: #187a75; stroke-width: 2; }
    .line { stroke: #52666c; stroke-width: 2; }
    .caption { fill: #52666c; font-size: 16px; }
  </style>
  <text x="150" y="34" text-anchor="middle" font-size="18" font-weight="700">Eén-op-één</text>
  <rect x="15" y="74" width="100" height="52" rx="5" class="entity" />
  <text x="65" y="106" text-anchor="middle" font-size="16">Student</text>
  <path d="M115 100h70" class="line" />
  <text x="124" y="88" class="caption" font-weight="700">1</text>
  <text x="168" y="88" class="caption" font-weight="700">1</text>
  <rect x="185" y="74" width="100" height="52" rx="5" class="entity" />
  <text x="235" y="106" text-anchor="middle" font-size="16">Studentnr.</text>
  <text x="150" y="164" text-anchor="middle" class="caption">Eén student heeft één nummer</text>

  <text x="450" y="34" text-anchor="middle" font-size="18" font-weight="700">Eén-op-veel</text>
  <rect x="315" y="74" width="100" height="52" rx="5" class="entity" />
  <text x="365" y="106" text-anchor="middle" font-size="16">Docent</text>
  <path d="M415 100h70" class="line" />
  <text x="424" y="88" class="caption" font-weight="700">1</text>
  <text x="468" y="88" class="caption" font-weight="700">N</text>
  <rect x="485" y="74" width="100" height="52" rx="5" class="entity" />
  <text x="535" y="106" text-anchor="middle" font-size="16">Student</text>
  <text x="450" y="164" text-anchor="middle" class="caption">Eén docent geeft les aan veel studenten</text>

  <text x="750" y="34" text-anchor="middle" font-size="18" font-weight="700">Veel-op-veel</text>
  <rect x="615" y="74" width="100" height="52" rx="5" class="entity" />
  <text x="665" y="106" text-anchor="middle" font-size="16">Student</text>
  <path d="M715 100h70" class="line" />
  <text x="724" y="88" class="caption" font-weight="700">N</text>
  <text x="768" y="88" class="caption" font-weight="700">M</text>
  <rect x="785" y="74" width="100" height="52" rx="5" class="entity" />
  <text x="835" y="106" text-anchor="middle" font-size="16">Cursus</text>
  <text x="750" y="164" text-anchor="middle" class="caption">Studenten volgen meerdere cursussen</text>
</svg>